name: V2 CI
on:
  push:
    branches: ["rebuild/v2", "main"]
  pull_request:
    branches: ["main", "rebuild/v2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py scout tests
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No browser script found.")
          Path("/tmp/scout-ui.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/scout-ui.js
      - run: PYTHONPATH=. pytest
