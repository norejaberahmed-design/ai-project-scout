name: V2 CI
on:
  push:
    branches: ["rebuild/v2", "main"]
  pull_request:
    branches: ["main", "rebuild/v2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py scout tests
      - run: PYTHONPATH=. pytest
