name: V2 CI
on:
  push:
    branches: ["rebuild/v2.1", "rebuild/v2", "main", "feature/agent-discovery-catalog", "feature/ai-tools-discovery-expansion", "atlas-phase1-hardening", "atlas-fullstack-foundation"]
  pull_request:
    branches: ["main", "rebuild/v2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py scout tests atlas
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for filename in ("site/index.html", "site/agents.html"):
              html = Path(filename).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              if not scripts:
                  raise SystemExit(f"No browser script found in {filename}.")
              output = Path("/tmp") / (Path(filename).stem + ".js")
              output.write_text("\n".join(scripts), encoding="utf-8")
              print(output)
          PY
          node --check /tmp/index.js
          node --check /tmp/agents.js
          node --check atlas/static/app.js
      - run: PYTHONPATH=. pytest
