name: AI Project Scout

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ai-project-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
    env:
      SCOUT_DB_PATH: data/scout.sqlite
      SCOUT_REPORT_DIR: reports
      SCOUT_PER_QUERY: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore history cache
        uses: actions/cache/restore@v4
        with:
          path: data/scout.sqlite
          key: ai-scout-db-${{ github.run_id }}
          restore-keys: |
            ai-scout-db-
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run scan
        run: python scout.py
      - name: Save history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/ai-project-scout/data/scout.sqlite
          key: ai-scout-db-${{ github.run_id }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-project-scout-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
