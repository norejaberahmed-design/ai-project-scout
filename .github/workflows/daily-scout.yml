name: AI Project Scout Agent

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      idea:
        description: "المشكلة أو الفكرة المراد التحقق منها"
        required: true
        type: string
        default: "متابعة الفواتير المتأخرة"
      buyer:
        description: "المشتري المستهدف"
        required: true
        type: string
        default: "المدير المالي في الشركات الصغيرة والمتوسطة"
      market:
        description: "السوق المستهدف"
        required: true
        type: string
        default: "السعودية"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-project-scout
  cancel-in-progress: false

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete offline test suite
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active = False; self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script": self.active = True
              def handle_endtag(self, tag):
                  if tag == "script": self.active = False
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
          parser = Scripts()
          parser.feed(Path("site/index.html").read_text(encoding="utf-8"))
          Path("/tmp/scout-dashboard.js").write_text("\n".join(parser.parts), encoding="utf-8")
          if not parser.parts: raise SystemExit("No inline dashboard script found")
          PY
          node --check /tmp/scout-dashboard.js

  research-agent:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SCOUT_DB_PATH: data/scout.sqlite
      SCOUT_REPORT_DIR: reports
      SCOUT_PER_QUERY: "20"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore SQLite history cache
        uses: actions/cache/restore@v4
        with:
          path: data/scout.sqlite
          key: ai-scout-db-${{ github.run_id }}
          restore-keys: |
            ai-scout-db-
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run technical discovery
        run: python scout.py
      - name: Discover reusable AI feature candidates
        run: python feature_hunter.py
      - name: Build self-improvement plan
        run: python self_improve.py
      - name: Propose one internal skill for the highest-priority documented gap
        if: ${{ secrets.SCOUT_LLM_API_KEY != '' && vars.SCOUT_LLM_MODEL != '' }}
        env:
          SCOUT_LLM_API_KEY: ${{ secrets.SCOUT_LLM_API_KEY }}
          SCOUT_LLM_MODEL: ${{ vars.SCOUT_LLM_MODEL }}
          SCOUT_LLM_API_URL: ${{ vars.SCOUT_LLM_API_URL || 'https://openrouter.ai/api/v1/chat/completions' }}
          SCOUT_REPORT_DIR: reports
        run: python skill_proposer.py
      - name: Reverse engineer candidate architectures (read-only)
        run: python reverse_engineer.py
      - name: Discover and rank reusable agent skills
        run: python skills_manager.py
      - name: Collect recent AI research papers
        run: python ai_updates.py
      - name: Run market research agent
        env:
          IDEA: ${{ inputs.idea || 'متابعة الفواتير المتأخرة' }}
          BUYER: ${{ inputs.buyer || 'المدير المالي في الشركات الصغيرة والمتوسطة' }}
          MARKET: ${{ inputs.market || 'السعودية' }}
        run: python agent.py --idea "$IDEA" --buyer "$BUYER" --market "$MARKET"
      - name: Prepare dashboard data
        run: |
          mkdir -p site/data
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          reports = Path("reports")
          data = Path("site/data")
          active_skills = []
          for skill_path in sorted(Path("skills/active").glob("*/SKILL.md"))[:4]:
              active_skills.append({"name": skill_path.parent.name, "content": skill_path.read_text(encoding="utf-8")[:6000]})
          (data / "active-skills.json").write_text(json.dumps({"skills": active_skills}, ensure_ascii=False, indent=2), encoding="utf-8")
          scout_files = [p for p in reports.glob("*.json") if p.name[:4].isdigit() and "ai-updates-" not in p.name and not p.name.startswith("agent-")]
          updates_files = list(reports.glob("ai-updates-*.json"))
          agent_files = list(reports.glob("agent-*.json"))
          feature_files = list(reports.glob("feature-candidates.json"))
          improvement_files = list(reports.glob("self-improvement-plan.json"))
          reverse_files = list(reports.glob("reverse-engineering.json"))
          skills_files = list(reports.glob("skills-catalog.json"))
          for files, target in [(scout_files, "scout.json"), (updates_files, "ai-updates.json"), (agent_files, "market-report.json"), (feature_files, "feature-candidates.json"), (improvement_files, "self-improvement-plan.json"), (reverse_files, "reverse-engineering.json"), (skills_files, "skills-catalog.json")]:
              if files:
                  shutil.copy2(max(files, key=lambda p: p.stat().st_mtime), data / target)
          (data / "status.json").write_text(json.dumps({
              "updated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "run_number": "${{ github.run_number }}",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Upload proposed internal skills for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-project-scout-proposed-skills-${{ github.run_number }}
          path: skills/proposed/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload reports for download
        uses: actions/upload-artifact@v4
        with:
          name: ai-project-scout-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save SQLite history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/scout.sqlite
          key: ai-scout-db-${{ github.run_id }}
