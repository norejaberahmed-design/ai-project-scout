name: AI Project Scout Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      idea:
        description: "المشكلة أو الفكرة المراد التحقق منها"
        required: true
        type: string
        default: "متابعة الفواتير المتأخرة"
      buyer:
        description: "المشتري المستهدف"
        required: true
        type: string
        default: "المدير المالي في الشركات الصغيرة والمتوسطة"
      market:
        description: "السوق المستهدف"
        required: true
        type: string
        default: "السعودية"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-project-scout
  cancel-in-progress: false

jobs:
  research-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SCOUT_DB_PATH: data/scout.sqlite
      SCOUT_REPORT_DIR: reports
      SCOUT_PER_QUERY: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore SQLite history cache
        uses: actions/cache/restore@v4
        with:
          path: data/scout.sqlite
          key: ai-scout-db-${{ github.run_id }}
          restore-keys: |
            ai-scout-db-
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run technical discovery
        run: python scout.py
      - name: Collect recent AI research papers
        run: python ai_updates.py
      - name: Run market research agent
        env:
          IDEA: ${{ inputs.idea || 'متابعة الفواتير المتأخرة' }}
          BUYER: ${{ inputs.buyer || 'المدير المالي في الشركات الصغيرة والمتوسطة' }}
          MARKET: ${{ inputs.market || 'السعودية' }}
        run: python agent.py --idea "$IDEA" --buyer "$BUYER" --market "$MARKET"
      - name: Prepare dashboard data
        run: |
          mkdir -p site/data
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          reports = Path("reports")
          data = Path("site/data")
          scout_files = [p for p in reports.glob("*.json") if p.name[:4].isdigit() and "ai-updates-" not in p.name and not p.name.startswith("agent-")]
          updates_files = list(reports.glob("ai-updates-*.json"))
          agent_files = list(reports.glob("agent-*.json"))
          for files, target in [(scout_files, "scout.json"), (updates_files, "ai-updates.json"), (agent_files, "market-report.json")]:
              if files:
                  shutil.copy2(max(files, key=lambda p: p.stat().st_mtime), data / target)
          (data / "status.json").write_text(json.dumps({
              "updated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "run_number": "${{ github.run_number }}",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Upload reports for download
        uses: actions/upload-artifact@v4
        with:
          name: ai-project-scout-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save SQLite history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/scout.sqlite
          key: ai-scout-db-${{ github.run_id }}
