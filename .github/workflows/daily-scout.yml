name: AI Project Scout Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ai-project-scout
  cancel-in-progress: false

jobs:
  research-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCOUT_DB_PATH: data/scout.sqlite
      SCOUT_REPORT_DIR: reports
      SCOUT_PER_QUERY: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore SQLite history cache
        uses: actions/cache/restore@v4
        with:
          path: data/scout.sqlite
          key: ai-scout-db-${{ github.run_id }}
          restore-keys: |
            ai-scout-db-
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run technical discovery
        run: python scout.py
      - name: Run market research agent
        run: python agent.py --idea "متابعة الفواتير المتأخرة" --buyer "المدير المالي في الشركات الصغيرة والمتوسطة" --market "السعودية"
      - name: Save SQLite history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/scout.sqlite
          key: ai-scout-db-${{ github.run_id }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-project-scout-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
