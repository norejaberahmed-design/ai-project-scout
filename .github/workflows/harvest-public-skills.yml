name: Harvest Public Agent Skills

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      max_proposals:
        description: "Maximum number of skill proposals to stage"
        required: true
        type: choice
        options: ["1", "2", "3"]
        default: "2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skill-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: \${{ github.token }}
      SCOUT_SKILL_DB_PATH: data/skills.sqlite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Compile and run regression tests before discovery
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Harvest licensed public skill documents
        id: harvest
        shell: bash
        run: |
          mkdir -p reports data
          LIMIT="\${{ inputs.max_proposals || '2' }}"
          python skill_harvester.py --limit "$LIMIT" --report reports/skill-harvest.json | tee /tmp/skill-harvest-output.json
          CREATED="$(python -c 'import json; print(json.load(open("reports/skill-harvest.json", encoding="utf-8")).get("proposals_created", 0))')"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "Proposals created: $CREATED"
      - name: Validate only quarantined skill documents changed
        if: steps.harvest.outputs.created != '0'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from skill_runtime import inspect_candidate
          report = json.loads(Path("reports/skill-harvest.json").read_text(encoding="utf-8"))
          if int(report.get("proposals_created", 0)) > 3:
              raise SystemExit("Proposal count exceeded the hard limit.")
          files = list(Path("skills/proposed").glob("*/SKILL.md"))
          if not files:
              raise SystemExit("Report claims proposals, but no proposal file exists.")
          for path in files:
              checked = inspect_candidate(path.read_text(encoding="utf-8"))
              if not checked.get("valid"):
                  raise SystemExit(f"Rejected {path}: {checked.get('errors')}")
          print(f"Static validation passed for {len(files)} proposal files; none are activated.")
          PY
          python -m compileall -q .
          python -m unittest discover -s tests -v
          git add skills/proposed/
          git diff --cached --check
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          allowed = ("/SKILL.md", "/ATTRIBUTION.md", "/UPSTREAM_LICENSE.txt")
          if not paths or any(
              not p.startswith("skills/proposed/") or not p.endswith(allowed)
              for p in paths
          ):
              raise SystemExit("Refusing to publish unexpected files: " + repr(paths))
          proposal_dirs = {str(Path(p).parent) for p in paths}
          for directory in proposal_dirs:
              expected = {directory + suffix for suffix in allowed}
              if not expected.issubset(set(paths)):
                  raise SystemExit("Proposal is missing source attribution or license text: " + directory)
          print("Only quarantined skills with attribution and upstream license text will be published.")
          PY
      - name: Open draft pull request for human review
        if: steps.harvest.outputs.created != '0'
        env:
          BRANCH_NAME: \${{ github.run_id }}
        run: |
          BRANCH_NAME="skill-harvest-$BRANCH_NAME"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Propose licensed public agent skills for review"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft \
            --title "Skill harvest: licensed public skill proposals" \
            --body "Automatically discovered public SKILL.md documents. Every candidate passed the repository license allowlist and static skill checks and is staged under skills/proposed only. Each document records its immutable source revision. No imported code was executed, installed, or activated. Review attribution, license obligations, usefulness, prompt-injection risks, and behavior before merging. Activation remains a separate explicit lifecycle step."
      - name: Upload harvest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-harvest-report-\${{ github.run_id }}
          path: reports/skill-harvest.json
          if-no-files-found: warn
          retention-days: 30
