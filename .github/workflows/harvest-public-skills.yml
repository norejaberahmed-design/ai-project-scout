name: Harvest Public Agent Skills

on:
  push:
    branches: [main]
    paths:
      - "skill_harvester.py"
      - "api_server.py"
      - "web_search.py"
      - "component_acquisition.py"
      - "skill_runtime.py"
      - "skill_registry.py"
      - "tests/**"
      - "tests/test_skill_runtime.py"
      - "skills/active/**"
      - ".github/workflows/harvest-public-skills.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      max_proposals:
        description: "Maximum number of skill proposals to stage"
        required: true
        type: choice
        options: ["1", "2", "3"]
        default: "2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skill-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SCOUT_SKILL_DB_PATH: data/skills.sqlite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Compile and run regression tests before discovery
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Harvest licensed public skill documents
        id: harvest
        shell: bash
        run: |
          mkdir -p reports data
          LIMIT="${{ inputs.max_proposals || '2' }}"
          python skill_harvester.py --limit "$LIMIT" --report reports/skill-harvest.json | tee /tmp/skill-harvest-output.json
          CREATED="$(python -c 'import json; print(json.load(open("reports/skill-harvest.json", encoding="utf-8")).get("proposals_created", 0))')"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "Proposals created: $CREATED"
      - name: Validate only quarantined skill documents changed
        if: steps.harvest.outputs.created != '0'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from skill_runtime import inspect_candidate
          report = json.loads(Path("reports/skill-harvest.json").read_text(encoding="utf-8"))
          if int(report.get("proposals_created", 0)) > 3:
              raise SystemExit("Proposal count exceeded the hard limit.")
          files = list(Path("skills/proposed").glob("*/SKILL.md"))
          if not files:
              raise SystemExit("Report claims proposals, but no proposal file exists.")
          for path in files:
              checked = inspect_candidate(path.read_text(encoding="utf-8"))
              if not checked.get("valid"):
                  raise SystemExit(f"Rejected {path}: {checked.get('errors')}")
          print(f"Static validation passed for {len(files)} proposal files; none are activated.")
          PY
          python -m compileall -q .
          python -m unittest discover -s tests -v
          git add skills/proposed/
          # Preserve upstream reference files verbatim; run whitespace checks on generated skill and attribution metadata.
          git diff --cached --check -- 'skills/proposed/**/SKILL.md' 'skills/proposed/**/ATTRIBUTION.md'
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          root_files = {"SKILL.md", "ATTRIBUTION.md", "UPSTREAM_LICENSE.txt", "BUNDLE_MANIFEST.json"}
          bundle_suffixes = {".md", ".rst", ".txt", ".json", ".toml", ".yaml", ".yml", ".py", ".js", ".mjs", ".cjs", ".ts", ".tsx", ".jsx", ".css", ".html", ".go", ".rs"}
          if not paths:
              raise SystemExit("No quarantined proposal files were staged.")
          for p in paths:
              path = Path(p)
              if not p.startswith("skills/proposed/"):
                  raise SystemExit("Refusing to publish unexpected file: " + p)
              parts = path.parts
              if "bundle" in parts:
                  if path.suffix.lower() not in bundle_suffixes or path.parts[parts.index("bundle") - 1] == "":
                      raise SystemExit("Refusing unsupported bundle file: " + p)
              elif path.name not in root_files or len(parts) != 4:
                  raise SystemExit("Refusing unexpected proposal file: " + p)
          proposal_dirs = {str(Path(p).parent) for p in paths if Path(p).name == "SKILL.md"}
          for directory in proposal_dirs:
              expected = {directory + "/" + name for name in root_files}
              if not expected.issubset(set(paths)):
                  raise SystemExit("Proposal is missing its skill, attribution, license, or bundle manifest: " + directory)
          print("Only quarantined skills with attribution, license, manifest, and safe text bundle files will be published.")
          PY
      - name: Open draft pull request for human review
        if: steps.harvest.outputs.created != '0'
        env:
          BRANCH_NAME: ${{ github.run_id }}
        run: |
          BRANCH_NAME="skill-harvest-$BRANCH_NAME"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Propose licensed public agent skills for review"
          git push origin "$BRANCH_NAME"
          if gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft \
            --title "Skill harvest: licensed public skill proposals" \
            --body "Automatically discovered public SKILL.md documents. Every candidate passed the repository license allowlist and static skill checks and is staged under skills/proposed only. Each document records its immutable source revision. No imported code was executed, installed, or activated. Review attribution, license obligations, usefulness, prompt-injection risks, and behavior before merging. Activation remains a separate explicit lifecycle step."; then
            echo "Draft pull request created."
          else
            echo "::warning::GitHub blocked PR creation using GITHUB_TOKEN. The validated proposals remain on the isolated branch; main will not be modified automatically."
            echo "Draft PR creation was blocked by repository Actions permissions." >> "$GITHUB_STEP_SUMMARY"
            echo "Proposal branch: https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH_NAME" >> "$GITHUB_STEP_SUMMARY"
            echo "Open a draft PR manually from this branch, or enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload harvest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-harvest-report-${{ github.run_id }}
          path: reports/skill-harvest.json
          if-no-files-found: warn
          retention-days: 30
