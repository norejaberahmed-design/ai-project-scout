name: Guarded AutoDev

on:
  push:
    branches:
      - main
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      run_autodev:
        description: "Run one bounded, free-model improvement attempt"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: guarded-autodev
  cancel-in-progress: false

jobs:
  guarded-autodev:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SCOUT_ENABLE_AUTODEV: ${{ vars.SCOUT_ENABLE_AUTODEV }}
      SCOUT_LLM_API_KEY: ${{ secrets.SCOUT_LLM_API_KEY }}
      SCOUT_LLM_MODEL: ${{ vars.SCOUT_LLM_MODEL }}
      SCOUT_AUTODEV_TARGET: ${{ vars.SCOUT_AUTODEV_TARGET || 'feature_hunter' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prevent duplicate open AutoDev pull requests
        id: duplicate
        shell: bash
        run: |
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("autodev-"))] | length')"
          echo "open_autodev_prs=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "An AutoDev PR is already open; skipping to avoid duplicate work."
          fi
      - name: Build fresh discovery and reverse-engineering evidence
        if: (github.event_name == 'schedule' || inputs.run_autodev == true) && steps.duplicate.outputs.open_autodev_prs == '0'
        env:
          SCOUT_DB_PATH: data/scout.sqlite
          SCOUT_REPORT_DIR: reports
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data reports
          python -m compileall -q .
          python scout.py
          python feature_hunter.py
          python self_improve.py
          python reverse_engineer.py
      - name: Ask configured free model to propose one evidence-grounded change
        if: (github.event_name == 'schedule' || inputs.run_autodev == true) && steps.duplicate.outputs.open_autodev_prs == '0'
        run: python autodev.py
      - name: Stop if there is no validated candidate
        id: candidate
        if: steps.duplicate.outputs.open_autodev_prs == '0'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_candidate=false" >> "$GITHUB_OUTPUT"
            echo "No change proposed; no branch or PR created."
            exit 0
          fi
          expected="$(python -c 'import os; from autodev import TARGETS; print(" ".join(TARGETS[os.getenv("SCOUT_AUTODEV_TARGET", "feature_hunter")]))')"
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          if [ "$actual" != "$(printf '%s' "$expected" | tr ' ' '\n' | sort | tr '\n' ' ')" ]; then
            echo "Unexpected file set; refusing to publish candidate."
            git diff --name-only
            exit 1
          fi
          echo "has_candidate=true" >> "$GITHUB_OUTPUT"
      - name: Compile and run full test suite
        if: steps.candidate.outputs.has_candidate == 'true'
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Reject unsafe diff characteristics
        if: steps.candidate.outputs.has_candidate == 'true'
        shell: bash
        run: |
          git diff --check
          if git diff --unified=0 | grep -E '^\+.*(subprocess|os\.system|eval\(|exec\(|https?://|api[_-]?key|token=|password=)' ; then
            echo "Potentially unsafe new code detected; refusing to publish."
            exit 1
          fi
          if [ "$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')" -gt 250 ]; then
            echo "Change exceeds 250 changed lines; refusing to publish."
            exit 1
          fi
      - name: Create a draft PR only after checks pass
        if: steps.candidate.outputs.has_candidate == 'true'
        env:
          BRANCH_NAME: ${{ github.run_id }}
        run: |
          BRANCH_NAME="autodev-$BRANCH_NAME"
          git checkout -b "$BRANCH_NAME"
          git add scout.py tests/test_scout.py feature_hunter.py tests/test_feature_hunter.py reverse_engineer.py tests/test_reverse_engineer.py agent.py tests/test_agent.py
          git commit -m "Propose bounded self-improvement"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft \
            --title "AutoDev: reviewed candidate improvement" \
            --body "Automated proposal (not merged). The bounded change was generated by the opt-in guarded AutoDev workflow, restricted to one allowlisted Python module and its paired tests. Python compilation and the complete offline test suite passed before publication. Please review before merging; no third-party repository code was executed or copied."
