name: Agent Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, self-improving-agent-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run complete offline test suite
        run: python -m unittest discover -s tests -v
      - name: Check chat UI JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.active = True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.active = False
              def handle_data(self, data):
                  if self.active:
                      self.parts.append(data)
          parser = Scripts()
          parser.feed(Path("site/index.html").read_text(encoding="utf-8"))
          if not parser.parts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/agent-chat.js").write_text("\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/agent-chat.js
      - name: Smoke-test no-key browser fallback
        run: node tests/frontend-smoke.cjs
      - name: Parse workflow YAML files
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").each { |path| YAML.load_file(path, aliases: true); puts "Valid YAML: #{path}" }'
      - name: Verify API container build
        run: docker build -t ai-project-scout-api:test .
      - name: Smoke-test API container health endpoint
        run: |
          docker run -d --name agent-api-test -p 8787:8787 ai-project-scout-api:test
          trap 'docker rm -f agent-api-test >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 10); do
            if curl --fail --silent http://127.0.0.1:8787/api/health; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs agent-api-test
            exit 1
          fi
          expected_proposals="$(find skills/proposed -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          curl --fail --silent http://127.0.0.1:8787/api/skills | python -c 'import json,sys; data=json.load(sys.stdin); expected=int(sys.argv[1]); assert isinstance(data.get("active_runtime"), list); assert isinstance(data.get("lifecycle_records"), list); sync=data.get("proposal_sync", {}); assert sync.get("scanned", 0) == expected, (sync, expected); assert sync.get("registered", 0) == expected, (sync, expected); assert sum(1 for item in data["lifecycle_records"] if item.get("status") == "PROPOSED") >= expected; print("Skill proposal sync passed:", expected)' "$expected_proposals"
      - name: Ensure secrets are not embedded in the public UI
        run: |
          if grep -E 'TAVILY_API_KEY=|SCOUT_LLM_API_KEY=|sk-or-v1-[A-Za-z0-9]+' site/index.html; then
            echo "Possible secret embedded in public UI"
            exit 1
          fi
