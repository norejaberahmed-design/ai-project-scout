name: Acquire Open-Source AI Component

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: "Public GitHub repository URL to inspect and stage"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: component-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect license and copy eligible files into quarantine
        id: acquire
        env:
          REPOSITORY_URL: ${{ inputs.repository_url }}
        run: |
          set -euo pipefail
          python component_acquisition.py "$REPOSITORY_URL" --confirm-copy | tee acquisition-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("acquisition-report.json").read_text(encoding="utf-8"))
          status = report.get("status", "UNKNOWN")
          print(f"Acquisition status: {status}")
          print(f"Repository: {report.get('repository_url', 'see report')}")
          print(f"Revision: {report.get('revision', 'not available')}")
          print("No downloaded code was installed, executed, or activated.")
          PY

      - name: Upload review-only component bundle and report
        uses: actions/upload-artifact@v4
        with:
          name: ai-project-scout-component-proposal
          path: |
            components/proposed/
            acquisition-report.json
          if-no-files-found: error
          retention-days: 14
