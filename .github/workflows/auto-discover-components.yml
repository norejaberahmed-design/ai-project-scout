name: Discover and Propose Open-Source AI Components

on:
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "Maximum repositories to inspect (1–3)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-ai-components
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover candidate repositories
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_CANDIDATES: ${{ inputs.max_candidates || '2' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          limit = max(1, min(3, int(os.environ.get("MAX_CANDIDATES", "2"))))
          queries = [
              "AI agent framework language:Python stars:>=100",
              "LLM tools library language:Python stars:>=100",
              "retrieval augmented generation library language:Python stars:>=100",
              "open source AI developer tools stars:>=100",
          ]
          seen = set()
          candidates = []
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AI-Project-Scout-Automated-Discovery",
          }
          for query in queries:
              url = "https://api.github.com/search/repositories?" + urllib.parse.urlencode({
                  "q": query + " archived:false",
                  "sort": "updated",
                  "order": "desc",
                  "per_page": "10",
              })
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
              except Exception as exc:
                  print("Search query failed; continuing safely:", type(exc).__name__)
                  continue
              for item in payload.get("items", []):
                  full_name = str(item.get("full_name", ""))
                  license_id = (item.get("license") or {}).get("spdx_id", "UNKNOWN")
                  if not full_name or full_name.lower() in seen:
                      continue
                  seen.add(full_name.lower())
                  if item.get("archived") or item.get("fork") or license_id not in {
                      "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD"
                  }:
                      continue
                  candidates.append({
                      "name": full_name,
                      "url": item.get("html_url"),
                      "stars": int(item.get("stargazers_count") or 0),
                      "pushed_at": item.get("pushed_at") or "",
                      "license": license_id,
                      "description": (item.get("description") or "")[:240],
                  })
          candidates.sort(key=lambda x: (x["pushed_at"], x["stars"]), reverse=True)
          chosen = candidates[:limit]
          Path("discovery-candidates.json").write_text(
              json.dumps(chosen, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          Path("discovery-candidates.txt").write_text(
              "".join(str(item["url"]) + "\n" for item in chosen if item.get("url")),
              encoding="utf-8",
          )
          print("Eligible search candidates selected:", len(chosen))
          for item in chosen:
              print(f"- {item['name']} | {item['license']} | stars={item['stars']}")
          PY

      - name: Inspect and stage candidates in quarantine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p components/proposed
          count=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            if [ "$count" -ge 3 ]; then break; fi
            echo "Reviewing public repository: $url"
            if python component_acquisition.py "$url" --confirm-copy; then
              count=$((count + 1))
            else
              echo "Skipped candidate after license, safety, or acquisition checks."
            fi
          done < discovery-candidates.txt
          echo "Acquisition attempts completed: $count"

      - name: Create review-only pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore: propose discovered open-source AI components"
          branch: automation/ai-component-proposals
          delete-branch: true
          title: "Automated proposal: reviewed open-source AI components"
          body: |
            This pull request contains quarantined source/document files discovered by the scheduled AI component scout.

            **Safety rules**
            - Candidate repositories are public and must declare an allowlisted SPDX license.
            - The importer verifies license text and pins each source revision.
            - Imported files remain in `components/proposed/`; no dependencies are installed and no downloaded code is executed or activated.
            - Review the manifest, file-level notices, dependency chain, security, and license obligations before any separate integration.
            - Search ranking and stars are discovery signals, not proof of quality or safety.

            This PR was generated by GitHub Actions. Human review is required.
          labels: |
            automated
            component-proposal

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-component-discovery-report
          path: |
            discovery-candidates.json
            components/proposed/
          if-no-files-found: warn
          retention-days: 14
