services:
  - type: web
    name: ai-project-scout-v2
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SCOUT_API_HOST
        value: 0.0.0.0
      - key: SCOUT_API_PORT
        value: "8080"
      - key: SCOUT_ALLOWED_ORIGINS
        value: https://norejaberahmed-design.github.io,http://127.0.0.1:8080,http://localhost:8080
      - key: SCOUT_LLM_API_KEY
        sync: false
      - key: SCOUT_LLM_MODEL
        sync: false
      - key: SCOUT_LLM_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: SCOUT_ADMIN_TOKEN
        sync: false
